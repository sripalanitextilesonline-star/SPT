name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy OpenNext Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project identity
        run: npm run identity:validate

      - name: Validate Wrangler production config
        run: npm run validate:wrangler

      - name: Run tests
        run: npm test -- --ci --forceExit

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aaa80267f9d75b8a485ef7139a1e9256
          SKIP_CACHE_POPULATE: "0"
          SKIP_ENV_VALIDATION: "true"
          # Build-time public values (from project.identity.json — not secrets)
          NEXT_PUBLIC_SITE_URL: https://sripalanitextiles.com
          NEXT_PUBLIC_SUPABASE_PROJECT_REF: xsatfugvvorelzeyyzwp
          NEXT_PUBLIC_SUPABASE_URL: https://xsatfugvvorelzeyyzwp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_S3_BUCKET: spt-cdn
          NEXT_PUBLIC_S3_REGION: auto
          NEXT_PUBLIC_CDN_URL: https://pub-65f24d69fb304b0b87901be92e533cb1.r2.dev
          S3_ENDPOINT: https://aaa80267f9d75b8a485ef7139a1e9256.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error title=Missing secret::Add CLOUDFLARE_API_TOKEN to repo Actions secrets."
            exit 1
          fi
          if [[ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" ]]; then
            echo "::error title=Missing secret::Add NEXT_PUBLIC_SUPABASE_ANON_KEY to repo Actions secrets."
            exit 1
          fi
          npm run deploy

      - name: Smoke check production health
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            "https://sripalanitextiles.com/api/health"
