name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy OpenNext Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project identity
        run: npm run identity:validate

      - name: Validate Wrangler production config
        run: npm run validate:wrangler

      - name: Run tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aaa80267f9d75b8a485ef7139a1e9256
          SKIP_CACHE_POPULATE: "0"
        run: npm run deploy

      - name: Smoke check production health
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            "https://sripalanitextiles.com/api/health"
